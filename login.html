<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>realme WVIS · Sign in</title><style>body{margin:0;background:#f4f5f7;color:#17191c;font:16px system-ui;min-height:100vh;display:grid;place-items:center}main{width:min(360px,85vw);padding:36px;background:white;border:1px solid #dde0e6;border-radius:20px;box-shadow:0 15px 40px #0001}h1{font-size:26px}label{display:block;margin:20px 0 8px}input,button{box-sizing:border-box;width:100%;padding:13px;font:inherit;border:1px solid #ccd0d7;border-radius:8px}button{background:#fbbc04;font-weight:700;margin-top:24px;cursor:pointer}#status{color:#a62e2e;font-size:14px;min-height:20px}.muted{color:#6b7280;font-size:13px}</style><script src="/login.js" defer></script></head><body><main><h1>realme WVIS</h1><p>Sign in to your dashboard</p><form id="login"><label for="username">Username</label><input id="username" autocomplete="username" required maxlength="80"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required maxlength="128"><button id="submit">Sign in</button></form><p id="status" role="alert"></p><p class="muted">Accounts and passwords are managed by your administrator.</p></main></body></html>
